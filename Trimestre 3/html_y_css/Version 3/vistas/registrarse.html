<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - GuramaOnline</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<header>
    <div class="header">
    <nav>
        <div class="logo">
        <a href="../index.html"><img src="../imagenes/Logo_GO.jpeg" alt="Logo de Gurama"></a>
        </div>
    </nav>
    </div>
</header>

<main>
    <h2>Crear cuenta</h2>

    <!-- FORMULARIO DE REGISTRO -->
    <form>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" required>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" required>

        <label for="contraseña">Contraseña</label>
        <input type="password" id="contraseña" required>

        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" required>

        <button type="submit">Registrarse</button>
    </form>

    <p>¿Ya tienes cuenta? <a href="iniciar_sesion.html">Inicia sesión</a></p>
</main>

</body>
</html>
