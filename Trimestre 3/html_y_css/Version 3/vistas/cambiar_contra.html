<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - GuramaOnline</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<header>
    <div class="header">
    <nav>
        <div class="logo">
            <a href="../index.html"><img src="../imagenes/Logo_GO.jpeg" alt="Logo de Gurama"></a>
        </div>
    </nav>
    </div>
</header>

<main>
    <h2>Cambiar contraseña</h2>

    <!-- FORMULARIO -->
    <form>
        <label for="actual">Contraseña actual</label>
        <input type="password" id="actual" required>

        <label for="nueva">Nueva contraseña</label>
        <input type="password" id="nueva" required>

        <label for="confirmar">Confirmar nueva contraseña</label>
        <input type="password" id="confirmar" required>

        <button type="submit">Actualizar contraseña</button>
    </form>
</main>

</body>
</html>
