<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entradas - GuramaOnline</title>
    <link rel="stylesheet" href="../css/panel_control.css">
    <link rel="stylesheet" href="../css/movimientos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- PANEL LATERAL -->
    <aside class="sidebar">
        <div class="logo">
            <a href="panel_admin.html">
                <img src="../imagenes/Logo_GO.jpeg" alt="GuramaOnline">
            </a>
        </div>
        
        <nav class="menu">
            <a href="panel_admin.html">
                <i class="fa-solid fa-gauge"></i>
                <span>Panel de control</span>
            </a>
            
            <a href="productos.html">
                <i class="fa-solid fa-box"></i>
                <span>Productos</span>
            </a>
        
            <a href="movimientos.html" >
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
                <span>Movimientos</span>
            </a>

            <a href="entradas.html" class="activo">
                <i class="fa-solid fa-arrow-down"></i>
                <span>Entradas</span>
            </a>

            <a href="salidas.html">
                <i class="fa-solid fa-arrow-up"></i>
                <span>Salidas</span>
            </a>
            
            <a href="usuario.html">
                <i class="fa-solid fa-user"></i>
                <span>Usuario</span>
            </a>
        </nav>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido">
        <header class="header-panel">
            <div>
                <h1>Entradas de Productos</h1>
                <p>Registra las entradas nuevas al inventario</p>
            </div>
            <div class="usuario">
                <a href="perfil_admi.html">
                    <span>Admin.gurama</span>
                    <img src="../imagenes/logo_perfil.webp" alt="perfil">
                </a>
            </div>
        </header>

        <!-- FORMULARIO DE ENTRADA -->
        <section class="cuadro-blanco form-producto">
            <form class="formulario" action="#" method="post">
                <div class="campo">
                    <label for="id_producto">ID Producto</label>
                    <input type="number" id="id_producto" name="id_producto" placeholder="Ingrese el ID del producto" required>
                </div>

                <div class="campo">
                    <label for="nombre_producto">Nombre del Producto</label>
                    <input type="text" id="nombre_producto" name="nombre_producto" placeholder="Ejemplo: Sábana Paw Patrol" required>
                </div>

                <div class="campo">
                    <label for="cantidad">Cantidad ingresada</label>
                    <input type="number" id="cantidad" name="cantidad" placeholder="Cantidad de unidades" required>
                </div>

                <div class="campo">
                    <label for="proveedor">Proveedor</label>
                    <input type="text" id="proveedor" name="proveedor" placeholder="Nombre del proveedor" required>
                </div>

                <div class="campo">
                    <label for="fecha">Fecha de entrada</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="campo">
                    <label for="observacion">Observaciones</label>
                    <textarea id="observacion" name="observacion" placeholder="Detalles adicionales..." rows="3"></textarea>
                </div>

                <div class="botones">
                        <button type="submit" class="btn-guardar">
                            <i class="fa-solid fa-floppy-disk"></i> Guardar
                        </button>
                        <button type="reset" class="btn-cancelar">
                            <i class="fa-solid fa-xmark"></i> Cancelar
                        </button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
