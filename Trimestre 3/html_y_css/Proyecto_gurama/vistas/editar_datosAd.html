<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar Datos - GuramaOnline</title>
  <link rel="stylesheet" href="../css/perfil_admi.css">
</head>

<body>
  <header>
        <img src="../imagenes/logo_GO.jpeg" alt="Logo de Gurama" />
        <a href="perfil_admi.html">
            <button class="registrarse">Volver</button>
        </a>    
    </header>

  <main class="perfil-container">

    <div class="form-card">
        <h2 class="form-title">Cambiar datos</h2>
            
          <div class="form-group">
              <input type="text" id="nombre_usuario" name="nombre_usuario" value="Andrea Gurama" placeholder=" " required>
              <label for="nombre_usuario">Nombre de usuario</label>
          </div>

          <div class="form-group">
              <input type="email" id="correo" name="correo" value="usuario@gmail.com" placeholder=" " required>
              <label for="correo">Correo electrónico</label>
          </div>
            
          <div class="form-group">
              <input type="tel" id="telefono" name="telefono" value="3287865455" placeholder=" " required>
              <label for="telefono">Número telefónico</label>
          </div>

          <div class="document-group">
              <div class="document-type">
                  <input type="text" id="tipo_doc" name="tipo_doc" value="Cedula de ciudadania (CC)" placeholder=" " readonly>
                  <label for="tipo_doc">Tipo de documento</label>
              </div>
          
          <div class="document-number">
                  <input type="text" id="numero_doc" name="numero_doc" value="1014937269" placeholder=" " required>
                  <label for="numero_doc">Número de documento</label>
              </div>
          </div>

          <a href="perfil_admi.html" class="btn-guardar">Guardar</a>
        
        </form>
    </div>
  </main>
</body> 
</html>
