<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambiar Contraseña - GuramaOnline</title>
<link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<header>
  <div class="header">
    <div class="logo">
      <img src="../imagenes/Logo_GO.jpeg" alt="Logo de Gurama">
    </div>
    <div class="volver-boton">
      <a href="perfil_admi.html">volver</a>
    </div>
  </div>
</header>


<main>

  <form class="form-cambiar">
    <div class="subtitulo">
    <h2>Cambiar contraseña</h2>
  </div>
    <label for="nueva">Nueva contraseña</label>
    <input type="password" id="nueva" placeholder="Ingresa tu nueva contraseña">

    <label for="confirmar">Confirmar contraseña</label>
    <input type="password" id="confirmar" placeholder="Confirma tu nueva contraseña">

    <button type="button" onclick="location.href='iniciar_sesion.html'">Guardar cambios</button>
  </form>
</main>

</body>
</html>
