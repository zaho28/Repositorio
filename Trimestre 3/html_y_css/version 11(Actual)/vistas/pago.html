<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pago - GuramaOnline</title>
    <link rel="stylesheet" href="../css/pagos.css">
</head>

<body>
    <!-- ENCABEZADO -->
    <header class="header-cliente">
        <div class="header-container_c">
                <div class="logo">
                    <a href="cliente.html">
                        <img src="../imagenes/Logo_GO2.png" alt="Logo Gurama Online">
                    </a>
                </div>

            <nav class="menu">
                <ul>
                <li><a href="cliente.html">Inicio</a></li>
                <li><a href="catalogo_2.html">Catálogo</a></li>
                <li><a href="pedidos_personalizados.html">Pedido personalizado</a></li>
                <li><a href="../index.html">Cerrar sesión</a></li>
                </ul>
            </nav>

            <div class="iconos">
                <a href="carrito.html"><img src="../imagenes/icono_carrito2.png" alt="Carrito"></a>
                <a href="perfil.html"><img src="../imagenes/icono_usuario.png" alt="Perfil"></a>
            </div>
        </div>
    </header>

    <!-- FORMULARIO -->
    <main class="pago-container">
        <form class="form-pago">
            <div class="subtitulo">
                <h2>Ticket de compra</h2>
            </div>

            <input type="text" placeholder="Ingrese su nombre" required>

            <select required>
                <option value="">Seleccione un metodo de pago</option>
                <option value="credito">tarjeta credito</option>
                <option value="debito">tarjeta debito</option>
                <option value="PSE">davipla/nequi</option>
            </select>

            <input type="text" placeholder="descripcion para el envio" required>

            <button type="boton" onclick="location.href='confirmar_pago.html'">Guardar</button>
        </form>
    </main> 

    <footer> 
        <p>Síguenos en nuestras redes sociales</p>
        <div class="redes"> 
            <a href="https://www.instagram.com/_guramaa_" target="_blank">Instagram
                <img src="../imagenes/logo_instagram.png" alt="instagram">
            </a> 
            <a href="https://www.tiktok.com/@_guramaa_" target="_blank">TikTok
                <img src="../imagenes/logo_tiktok.png" alt="tiktok">
            </a>
        </div>
    </footer>
</body>
</html>
